<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Nebula Monitor · 用户与权限（设计原型）</title>
<style>
  :root{
    --primary:#2563EB; --primary-d:#1D4ED8; --primary-l:#3B82F6;
    --bg:#F5F7FA; --panel:#FFFFFF; --bg-soft:#F8FAFC;
    --t1:#1F2937; --t2:#4B5563; --t3:#9CA3AF;
    --ok:#16A34A; --warn:#F59E0B; --danger:#DC2626; --violet:#7C3AED;
    --border:#E5E7EB; --radius:10px; --shadow:0 1px 3px rgba(16,24,40,.08),0 1px 2px rgba(16,24,40,.06);
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--t1);font-size:14px}
  .app{display:grid;grid-template-columns:220px 1fr;min-height:100vh}
  /* sidebar */
  .side{background:#0F172A;color:#CBD5E1;padding:18px 12px;display:flex;flex-direction:column;gap:4px}
  .side .logo{display:flex;align-items:center;gap:10px;font-weight:600;color:#fff;font-size:15px;padding:6px 10px 16px}
  .side .logo .dot{width:22px;height:22px;border-radius:6px;background:linear-gradient(135deg,var(--primary-l),var(--primary-d));box-shadow:0 0 0 4px rgba(37,99,235,.18)}
  .nav{display:flex;flex-direction:column;gap:2px}
  .nav a{color:#94A3B8;text-decoration:none;padding:9px 12px;border-radius:8px;font-size:13.5px;transition:.18s}
  .nav a:hover{background:rgba(148,163,184,.12);color:#E2E8F0}
  .nav a.active{background:rgba(37,99,235,.22);color:#fff}
  .nav .grp{font-size:11px;color:#64748B;padding:14px 12px 4px;letter-spacing:.06em}
  /* main */
  .main{display:flex;flex-direction:column}
  .topbar{height:56px;background:var(--panel);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 22px;box-shadow:var(--shadow)}
  .topbar .crumb{color:var(--t2);font-size:13.5px}
  .topbar .crumb b{color:var(--t1)}
  .userchip{display:flex;align-items:center;gap:10px}
  .userchip .av{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,#22D3EE,#2563EB);color:#fff;display:grid;place-items:center;font-size:12px;font-weight:600}
  .userchip .meta{line-height:1.2}
  .userchip .meta .n{font-weight:600;font-size:13px}
  .userchip .meta .r{color:var(--t3);font-size:11.5px}
  .content{padding:22px;display:grid;grid-template-columns:300px 1fr;gap:18px;align-items:start}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}
  .card .hd{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--border)}
  .card .hd h3{margin:0;font-size:15px;font-weight:600}
  .card .bd{padding:10px 12px}
  /* left list */
  .seg{display:flex;gap:6px;padding:12px 12px 4px}
  .seg button{flex:1;border:1px solid var(--border);background:var(--bg-soft);color:var(--t2);padding:7px;border-radius:8px;cursor:pointer;font-size:13px;transition:.15s}
  .seg button.on{background:var(--primary);color:#fff;border-color:var(--primary)}
  .row{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;cursor:pointer;transition:.15s;border:1px solid transparent}
  .row:hover{background:var(--bg-soft)}
  .row.sel{background:rgba(37,99,235,.07);border-color:rgba(37,99,235,.25)}
  .row .av{width:32px;height:32px;border-radius:8px;background:linear-gradient(135deg,#60A5FA,#2563EB);color:#fff;display:grid;place-items:center;font-weight:600;font-size:13px}
  .row .info{line-height:1.25;flex:1;min-width:0}
  .row .info .nm{font-weight:600;font-size:13.5px}
  .row .info .sub{color:var(--t3);font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tag{font-size:11px;padding:2px 7px;border-radius:999px;font-weight:500}
  .tag.ok{background:rgba(22,163,74,.12);color:var(--ok)}
  .tag.off{background:rgba(156,163,175,.18);color:var(--t2)}
  .tag.b{background:rgba(37,99,235,.12);color:var(--primary)}
  .tag.c{background:rgba(124,58,237,.12);color:var(--violet)}
  /* right */
  .rbd{padding:16px}
  .toolbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
  .toolbar .ttl{font-size:16px;font-weight:600}
  .btn{border:1px solid var(--border);background:#fff;color:var(--t1);padding:8px 14px;border-radius:8px;cursor:pointer;font-size:13px;transition:.15s}
  .btn:hover{border-color:var(--primary-l);color:var(--primary)}
  .btn.primary{background:var(--primary);color:#fff;border-color:var(--primary)}
  .btn.primary:hover{background:var(--primary-d);color:#fff}
  .btn.danger{color:var(--danger);border-color:rgba(220,38,38,.3)}
  .btn.danger:hover{background:rgba(220,38,38,.06)}
  .btn.sm{padding:5px 10px;font-size:12px}
  .kv{display:flex;gap:18px;flex-wrap:wrap;color:var(--t2);font-size:13px;margin:6px 0 16px}
  .kv b{color:var(--t1)}
  /* table */
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{text-align:left;padding:11px 14px;border-bottom:1px solid var(--border)}
  th{color:var(--t3);font-weight:500;font-size:12px;background:var(--bg-soft)}
  tbody tr:hover{background:var(--bg-soft)}
  .acts{display:flex;gap:6px}
  /* matrix */
  .matrix{border:1px solid var(--border);border-radius:10px;overflow:hidden}
  .md{grid-template-columns:none;display:block}
  details{border-bottom:1px solid var(--border)}
  details:last-child{border-bottom:none}
  summary{padding:12px 14px;cursor:pointer;font-weight:600;background:var(--bg-soft);display:flex;align-items:center;gap:8px}
  summary .cnt{margin-left:auto;color:var(--t3);font-weight:400;font-size:12px}
  .mrows{padding:6px 14px 12px}
  .mrow{display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px dashed var(--border)}
  .mrow:last-child{border-bottom:none}
  .mrow .pn{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px;color:var(--t2)}
  .mrow .pd{color:var(--t3);font-size:11.5px}
  /* toggle */
  .sw{position:relative;width:40px;height:22px;flex:0 0 auto}
  .sw input{display:none}
  .sw .tk{position:absolute;inset:0;background:#CBD5E1;border-radius:999px;transition:.18s;cursor:pointer}
  .sw .tk:before{content:"";position:absolute;width:18px;height:18px;left:2px;top:2px;background:#fff;border-radius:50%;transition:.18s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
  .sw input:checked+.tk{background:var(--primary)}
  .sw input:checked+.tk:before{transform:translateX(18px)}
  /* scope tree */
  .scope{display:flex;gap:18px;flex-wrap:wrap;margin-top:6px}
  .scope .box{flex:1;min-width:240px;border:1px solid var(--border);border-radius:10px;padding:12px}
  .scope .box h4{margin:0 0 10px;font-size:13.5px}
  .tree .node{display:flex;align-items:center;gap:8px;padding:7px 0}
  .tree .node .cb{width:16px;height:16px;border-radius:4px;border:1.5px solid var(--t3);display:grid;place-items:center;cursor:pointer}
  .tree .node .cb.on{background:var(--primary);border-color:var(--primary);color:#fff}
  .tree .ch{margin-left:22px;color:var(--t2);font-size:12.5px}
  .hint{font-size:12px;color:var(--warn);background:rgba(245,158,11,.1);border:1px solid rgba(245,158,11,.3);padding:10px 12px;border-radius:8px;margin-top:10px}
  .range{display:flex;align-items:center;gap:10px;margin:4px 0 12px}
  .range .seg2{display:flex;border:1px solid var(--border);border-radius:8px;overflow:hidden}
  .range .seg2 button{border:none;background:#fff;padding:7px 14px;cursor:pointer;font-size:13px;color:var(--t2)}
  .range .seg2 button.on{background:var(--primary);color:#fff}
  /* modal */
  .mask{position:fixed;inset:0;background:rgba(15,23,42,.45);display:none;place-items:center;z-index:50}
  .mask.show{display:grid}
  .modal{width:440px;background:#fff;border-radius:14px;box-shadow:0 20px 60px rgba(2,6,23,.3);overflow:hidden;animation:pop .2s ease}
  @keyframes pop{from{transform:scale(.96);opacity:0}to{transform:scale(1);opacity:1}}
  .modal .mh{padding:18px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px}
  .modal .mh .ic{width:34px;height:34px;border-radius:9px;background:rgba(220,38,38,.12);color:var(--danger);display:grid;place-items:center;font-size:18px}
  .modal .mh h3{margin:0;font-size:16px}
  .modal .mb{padding:18px 20px;color:var(--t2);line-height:1.6;font-size:13.5px}
  .modal .mf{padding:14px 20px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:10px}
  .empty{padding:60px 20px;text-align:center;color:var(--t3)}
  .empty .e{font-size:40px;margin-bottom:10px}
  /* toast */
  .toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(20px);background:#0F172A;color:#fff;padding:12px 18px;border-radius:10px;font-size:13px;opacity:0;transition:.25s;z-index:60;box-shadow:0 10px 30px rgba(0,0,0,.3)}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="logo"><span class="dot"></span> Nebula Monitor</div>
    <nav class="nav">
      <a href="#">概览</a>
      <a href="#">主机监控</a>
      <a href="#">节点分组</a>
      <a href="#">告警中心</a>
      <a href="#">中间件</a>
      <a href="#">安全中心</a>
      <div class="grp">系统设置</div>
      <a href="#">基础配置</a>
      <a href="#" class="active">用户与权限</a>
      <a href="#">审计日志</a>
      <a href="#">系统升级</a>
    </nav>
  </aside>

  <section class="main">
    <header class="topbar">
      <div class="crumb">系统设置 / <b>用户与权限</b></div>
      <div class="userchip">
        <div class="meta" style="text-align:right">
          <div class="n">admin</div>
          <div class="r">超级管理员 · 全部资源</div>
        </div>
        <div class="av">A</div>
      </div>
    </header>

    <div class="content">
      <!-- LEFT -->
      <div class="card">
        <div class="hd"><h3>用户与角色</h3></div>
        <div class="seg">
          <button id="tabUsers" class="on" onclick="switchTab('users')">用户</button>
          <button id="tabRoles" onclick="switchTab('roles')">角色</button>
        </div>
        <div class="bd" id="leftList"></div>
      </div>

      <!-- RIGHT -->
      <div class="card">
        <div class="rbd" id="right"></div>
      </div>
    </div>
  </section>
</div>

<!-- risk modal -->
<div class="mask" id="mask">
  <div class="modal">
    <div class="mh"><div class="ic">!</div><h3 id="mTitle">高风险操作确认</h3></div>
    <div class="mb" id="mBody"></div>
    <div class="mf">
      <button class="btn" onclick="closeModal()">取消</button>
      <button class="btn danger" id="mConfirm" onclick="confirmRisk()">确认执行</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const users=[
  {u:'admin',d:'系统管理员',roles:['超级管理员'],scope:'global',status:'enabled',login:'2026-08-17 09:12',ip:'10.20.3.11'},
  {u:'ops_zhang',d:'张运维',roles:['运维管理员'],scope:'restricted',status:'enabled',login:'2026-08-16 22:40',ip:'10.20.3.24'},
  {u:'alert_li',d:'李告警',roles:['告警管理员'],scope:'restricted',status:'enabled',login:'2026-08-15 11:03',ip:'10.20.3.31'},
  {u:'sec_wang',d:'王安全',roles:['安全管理员'],scope:'restricted',status:'enabled',login:'2026-08-17 08:55',ip:'10.20.3.40'},
  {u:'viewer_chen',d:'陈只读',roles:['只读用户'],scope:'restricted',status:'disabled',login:'2026-08-10 14:20',ip:'10.20.3.52'},
];
const roles=[
  {n:'超级管理员',b:true,desc:'全部权限，可管理用户、角色、系统配置与审计',scope:'global',users:1},
  {n:'运维管理员',b:true,desc:'主机、分组、Agent、中间件、拨测、报告与告警运维',scope:'global',users:1},
  {n:'告警管理员',b:true,desc:'告警规则、通知、静默、维护窗口',scope:'global',users:1},
  {n:'安全管理员',b:true,desc:'安全中心、入侵防御与审计查看',scope:'global',users:1},
  {n:'只读用户',b:true,desc:'仪表盘、主机、中间件、告警与报告只读',scope:'restricted',users:1},
  {n:'审计用户',b:true,desc:'仅查看与导出审计记录',scope:'global',users:0},
];
const domains=[
  {g:'仪表盘',items:[['dashboard:read','查看概览']]},
  {g:'主机 / 节点',items:[['nodes:read','查看主机'],['nodes:write','管理主机']]},
  {g:'节点分组',items:[['groups:read','查看分组'],['groups:write','管理分组']]},
  {g:'告警',items:[['alerts:read','查看规则'],['alerts:write','管理规则']]},
  {g:'通知',items:[['notify:read','查看渠道'],['notify:write','管理渠道']]},
  {g:'安全',items:[['security:read','查看安全'],['security:write','操作安全'],['agent:secret:read','查看 Agent 密钥']]},
  {g:'Agent',items:[['agent:read','查看 Agent'],['agent:upgrade','升级 Agent']]},
  {g:'系统',items:[['system:upgrade','系统升级'],['audit:read','查看审计'],['audit:export','导出审计'],['users:manage','用户管理'],['roles:manage','角色管理']]},
];
const groups=[{n:'默认分组',c:18},{n:'华东机房',c:24,ch:['web-prod-01','db-prod-02']},{n:'华北机房',c:12,ch:['edge-01','edge-02']}];
let cur={tab:'users',sel:0};

function switchTab(t){cur.tab=t;document.getElementById('tabUsers').classList.toggle('on',t==='users');document.getElementById('tabRoles').classList.toggle('on',t==='roles');cur.sel=0;render();}
function render(){
  cur.tab==='users'?renderUsers():renderRoles();
}
function renderUsers(){
  const list=document.getElementById('leftList');
  list.innerHTML=users.map((u,i)=>`<div class="row ${i===cur.sel?'sel':''}" onclick="sel(${i})">
    <div class="av">${u.u[0].toUpperCase()}</div>
    <div class="info"><div class="nm">${u.d} <span class="tag b">${u.roles[0]}</span></div>
    <div class="sub">${u.u} · ${u.scope==='global'?'全部资源':'受限范围'}</div></div>
    <span class="tag ${u.status==='enabled'?'ok':'off'}">${u.status==='enabled'?'启用':'禁用'}</span></div>`).join('');
  const u=users[cur.sel];
  document.getElementById('right').innerHTML=`
    <div class="toolbar"><div class="ttl">${u.d}</div>
      <div style="display:flex;gap:8px">
        <button class="btn sm" onclick="toast('已发送密码重置邮件（演示）')">重置密码</button>
        <button class="btn sm ${u.status==='enabled'?'danger':''}" onclick="risk('${u.status==='enabled'?'禁用用户':'启用用户'}','将${u.status==='enabled'?'撤销':'恢复'} <b>${u.u}</b> 的登录权限，已签发会话立即失效。')">${u.status==='enabled'?'禁用':'启用'}</button>
        <button class="btn sm danger" onclick="risk('删除用户','永久删除用户 <b>${u.u}</b>，该操作不可恢复。')">删除</button>
      </div></div>
    <div class="kv"><span>用户名：<b>${u.u}</b></span><span>角色：<b>${u.roles.join('、')}</b></span>
      <span>状态：<b>${u.status==='enabled'?'启用':'禁用'}</b></span><span>资源范围：<b>${u.scope==='global'?'全部资源':'受限（按节点分组）'}</b></span></div>
    <div class="range"><div style="font-weight:600">节点范围</div>
      <div class="seg2"><button class="${u.scope==='global'?'on':''}">全部资源</button><button class="${u.scope!=='global'?'on':''}">受限范围</button></div></div>
    ${u.scope!=='global'?scopeTree():'<div class="hint">当前为受限范围：仅可访问已勾选分组下的节点。未勾选任何分组表示“无任何资源权限”。</div>'}
    <div class="kv" style="margin-top:16px"><span>最近登录：<b>${u.login}</b></span><span>来源 IP：<b>${u.ip}</b></span></div>`;
}
function renderRoles(){
  const list=document.getElementById('leftList');
  list.innerHTML=roles.map((r,i)=>`<div class="row ${i===cur.sel?'sel':''}" onclick="sel(${i})">
    <div class="av" style="background:linear-gradient(135deg,#A78BFA,#7C3AED)">${r.n[0]}</div>
    <div class="info"><div class="nm">${r.n} ${r.b?'<span class="tag c">内置</span>':''}</div>
    <div class="sub">${r.scope==='global'?'全局':'受限'} · ${r.users} 个用户</div></div></div>`).join('');
  const r=roles[cur.sel];
  document.getElementById('right').innerHTML=`
    <div class="toolbar"><div class="ttl">${r.n} ${r.b?'<span class="tag c">内置角色</span>':''}</div>
      ${r.b?'<button class="btn sm" onclick="toast(\'内置角色不可编辑，可复制为自定义角色（演示）\')">复制为自定义</button>':'<button class="btn sm primary">保存修改</button>'}</div>
    <div class="kv"><span>说明：<b>${r.d}</b></span><span>范围：<b>${r.scope==='global'?'全部资源':'受限'}</b></span><span>关联用户：<b>${r.users}</b></span></div>
    <div class="matrix">${domains.map(d=>`<details open><summary>${d.g}<span class="cnt">${d.items.length} 项</span></summary>
      <div class="mrows">${d.items.map(it=>`<div class="mrow"><div><div class="pn">${it[0]}</div><div class="pd">${it[1]}</div></div>
      <label class="sw"><input type="checkbox" ${['超级管理员','运维管理员','告警管理员','安全管理员','只读用户'].includes(r.n)||it[0].endsWith(':read')?'checked':''}><span class="tk"></span></label></div>`).join('')}</div></details>`).join('')}</div>
    <div class="hint">自定义角色的资源范围不得超过创建者自身范围；仅超级管理员可创建「全部资源」角色。</div>`;
}
function scopeTree(){return `<div class="scope"><div class="box"><h4>节点分组范围</h4>
  <div class="tree">${groups.map(g=>`<div class="node"><div class="cb on" onclick="this.classList.toggle('on')">✓</div><b>${g.n}</b> <span style="color:var(--t3);font-size:12px">（${g.c} 节点）</span></div>
    ${(g.ch||[]).map(c=>`<div class="node ch"><div class="cb on" onclick="this.classList.toggle('on')">✓</div>${c}</div>`).join('')}`).join('')}</div></div>
  <div class="box"><h4>范围摘要</h4><p style="color:var(--t2);line-height:1.7">已选 <b>3</b> 个分组，覆盖 <b>54</b> 个节点。<br><span style="color:var(--warn)">未勾选任何分组 = 无资源权限。</span></p></div></div>`;}
function sel(i){cur.sel=i;render();}
function risk(title,body){document.getElementById('mTitle').textContent=title;document.getElementById('mBody').innerHTML=body;document.getElementById('mask').classList.add('show');}
function closeModal(){document.getElementById('mask').classList.remove('show');}
function confirmRisk(){closeModal();toast('操作已记录审计（演示）');}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2200);}
document.getElementById('mask').addEventListener('click',e=>{if(e.target.id==='mask')closeModal();});
render();
</script>
</body>
</html>
